name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-core:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src tests
      - run: pytest -q -m "not gui"
      - run: python -m build
      - run: python -c "import glob; wheels = glob.glob('dist/*.whl'); assert wheels, 'no wheel built'; print(wheels[0])"
      - run: remnant2-saves --help

  test-gui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,gui]"
      - run: pytest -q -m gui
        env:
          QT_QPA_PLATFORM: offscreen
